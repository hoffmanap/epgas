name: Daily Gas Price Scrape

on:
  schedule:
    # GasBuddy prices are crowdsourced - which stations have a
    # recent-enough reported price shifts throughout the day as
    # people fill up and report. A single run only catches whatever
    # happens to be fresh at that moment, so run several times a day
    # and let them union together into each day's dataset instead of
    # relying on one snapshot (or on manual re-runs) for coverage.
    # Times are deliberately off the top of the hour: GitHub's
    # scheduler queues on-the-hour cron times most heavily, and can
    # delay or silently drop runs there.
    - cron: "12 13 * * *"  # ~7:12am MDT
    - cron: "12 18 * * *"  # ~12:12pm MDT
    - cron: "12 23 * * *"  # ~5:12pm MDT
    - cron: "42 3 * * *"   # ~9:42pm MDT (following UTC day)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gas-price-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium browser
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Clean and harmonize dataset
        run: python clean_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add el_paso_gas_prices.csv station_master.csv listing_state.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated daily gas price scrape: $(date -u +'%Y-%m-%d')"
            git push
          fi
