name: Daily Gas Price Scrape

on:
  schedule:
    # 13:00 UTC = ~6-7am in El Paso (America/Denver), depending on DST
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gas-price-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium browser
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Clean and harmonize dataset
        run: python clean_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add el_paso_gas_prices.csv station_master.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated daily gas price scrape: $(date -u +'%Y-%m-%d')"
            git push
          fi
