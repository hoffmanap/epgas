name: Daily Gas Price Scrape

on:
  schedule:
    # GasBuddy prices are crowdsourced - which stations have a
    # recent-enough reported price shifts throughout the day as
    # people fill up and report. A single run only catches whatever
    # happens to be fresh at that moment, so run hourly through the
    # window when people are actually out driving and reporting
    # prices, and let the runs union together into each day's
    # dataset instead of relying on one snapshot for coverage.
    # 14-22 UTC = 8am-4pm MDT (America/Denver). Shifts to 9am-5pm
    # once DST ends in November - bump this range by 1 then.
    # Minute is deliberately off the top of the hour: GitHub's
    # scheduler queues on-the-hour cron times most heavily, and can
    # delay or silently drop runs there.
    - cron: "12 14-22 * * *"  # hourly, ~8:12am-4:12pm MDT
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gas-price-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone - the push step
          # below rebases onto whatever's on main by the time it runs,
          # and a shallow clone doesn't have the common ancestor needed
          # for that to work cleanly.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium browser
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Clean and harmonize dataset
        run: python clean_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add el_paso_gas_prices.csv station_price_history.csv station_master.csv listing_state.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Automated daily gas price scrape: $(TZ='America/Denver' date +'%Y-%m-%d')"

          # main can move between checkout and here - another scrape run,
          # or an unrelated push like a dashboard update - so rebase onto
          # whatever's current before pushing, and retry a few times in
          # case something else wins the same race.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict on attempt $attempt - aborting and retrying."
              git rebase --abort
            elif git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            else
              echo "Push rejected on attempt $attempt, retrying..."
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to push after retries." >&2
          exit 1
